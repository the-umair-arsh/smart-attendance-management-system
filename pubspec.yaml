name: untitled2
description: "Smart Attendance Management Application (SAMA)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase - Backend
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.12

  # UI aur Fonts (Blue & White theme )
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # QR Code Features
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Device Binding (Proxy Protection )
  device_info_plus: ^11.1.1

  # Reports Generation
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    # assets/logo.png

# Icon Setting
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# Splash Screen Setting (Fixed Logo Size)
flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png


  android: true
  ios: true


  android_12:
    image: assets/icon/icon.png
    color: "#ffffff"
    icon_background_color: "#ffffff"

  #
  android_12_icon_size: 48